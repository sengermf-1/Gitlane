<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b919c"/></marker></defs>
  <rect width="720" height="300" rx="14" fill="#14161a"/>

  <text x="28" y="40" font-size="13" font-weight="600" fill="#e8eaed">Ship your work in two commands</text>
  <rect x="28" y="56" width="150" height="56" rx="10" fill="#1c1f25" stroke="#3a3f48"/>
  <text x="103" y="80" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#7fb0ff">/git-commit</text>
  <text x="103" y="99" text-anchor="middle" font-size="11" fill="#8b919c">Claude writes the message</text>
  <path d="M178 84 H236" stroke="#8b919c" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="240" y="56" width="150" height="56" rx="10" fill="#1c1f25" stroke="#3a3f48"/>
  <text x="315" y="80" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#7fb0ff">/git-push</text>
  <text x="315" y="99" text-anchor="middle" font-size="11" fill="#8b919c">All pending commits</text>
  <path d="M390 84 H448" stroke="#8b919c" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="452" y="56" width="240" height="56" rx="10" fill="#3ecf8e18" stroke="#3ecf8e"/>
  <text x="572" y="80" text-anchor="middle" font-size="13" fill="#6fe0ae">On the remote</text>
  <text x="572" y="99" text-anchor="middle" font-size="11" fill="#8b919c">No pane, no clicks</text>

  <text x="28" y="164" font-size="13" font-weight="600" fill="#e8eaed">Discarding is deliberate</text>
  <rect x="28" y="180" width="200" height="72" rx="10" fill="#1c1f25" stroke="#3a3f48"/>
  <text x="128" y="204" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#f5a35c">/git-discardall</text>
  <text x="128" y="224" text-anchor="middle" font-size="11" fill="#8b919c">1st run: shows what would go</text>
  <text x="128" y="240" text-anchor="middle" font-size="11" fill="#8b919c">Nothing is deleted yet</text>
  <path d="M228 216 H300" stroke="#8b919c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="264" y="208" text-anchor="middle" font-size="10" fill="#8b919c">within 1 min</text>
  <rect x="304" y="180" width="200" height="72" rx="10" fill="#1c1f25" stroke="#3a3f48"/>
  <text x="404" y="204" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#f5a35c">/git-discardall</text>
  <text x="404" y="224" text-anchor="middle" font-size="11" fill="#8b919c">2nd run: discards everything</text>
  <text x="404" y="240" text-anchor="middle" font-size="11" fill="#8b919c">Cannot be undone</text>
</svg>
