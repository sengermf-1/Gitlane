<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="'Segoe UI',-apple-system,Inter,Helvetica,Arial,sans-serif">
  <title>Gitlane commands</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242424"/><stop offset="1" stop-color="#1f1f1f"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1.5L7 5 2 8.5" fill="none" stroke="#6f6f6f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="719" height="329" rx="16" fill="#1a1a1a" stroke="#2b2b2b"/>

  <!-- ship -->
  <text x="32" y="46" font-size="12" font-weight="600" letter-spacing="1.2" fill="#8a8a8a">SHIP YOUR WORK</text>

  <g filter="url(#soft)">
    <rect x="32" y="64" width="200" height="82" rx="14" fill="url(#card)" stroke="#2e2e2e"/>
    <rect x="260" y="64" width="200" height="82" rx="14" fill="url(#card)" stroke="#2e2e2e"/>
    <rect x="488" y="64" width="200" height="82" rx="14" fill="url(#card)" stroke="#2e2e2e"/>
  </g>

  <rect x="50" y="80" width="104" height="26" rx="8" fill="#1d3a44"/>
  <text x="102" y="97.5" text-anchor="middle" font-family="Consolas,ui-monospace,monospace" font-size="13.5" fill="#9fdcee">/git-commit</text>
  <text x="50" y="128" font-size="12.5" fill="#a3a3a3">Claude writes the message</text>

  <rect x="278" y="80" width="86" height="26" rx="8" fill="#1d3a44"/>
  <text x="321" y="97.5" text-anchor="middle" font-family="Consolas,ui-monospace,monospace" font-size="13.5" fill="#9fdcee">/git-push</text>
  <text x="278" y="128" font-size="12.5" fill="#a3a3a3">Every pending commit</text>

  <circle cx="515" cy="93" r="9" fill="#1f3a2b"/>
  <path d="M510.8 93.2l3 3 5-5.4" fill="none" stroke="#7fd0a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="534" y="98" font-size="14" font-weight="500" fill="#e6e6e6">On the remote</text>
  <text x="506" y="128" font-size="12.5" fill="#a3a3a3">No pane, no clicks</text>

  <path d="M238 105H252" stroke="#6f6f6f" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M466 105H480" stroke="#6f6f6f" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- discard -->
  <text x="32" y="196" font-size="12" font-weight="600" letter-spacing="1.2" fill="#8a8a8a">DISCARDING IS DELIBERATE</text>

  <g filter="url(#soft)">
    <rect x="32" y="214" width="288" height="84" rx="14" fill="url(#card)" stroke="#2e2e2e"/>
    <rect x="388" y="214" width="300" height="84" rx="14" fill="url(#card)" stroke="#2e2e2e"/>
  </g>

  <rect x="50" y="230" width="124" height="26" rx="8" fill="#3d3220"/>
  <text x="112" y="247.5" text-anchor="middle" font-family="Consolas,ui-monospace,monospace" font-size="13.5" fill="#efc77a">/git-discardall</text>
  <text x="188" y="247.5" font-size="11.5" font-weight="500" fill="#8a8a8a">1st run</text>
  <text x="50" y="276" font-size="12.5" fill="#a3a3a3">Shows what would go. Nothing is deleted.</text>

  <rect x="406" y="230" width="124" height="26" rx="8" fill="#3d3220"/>
  <text x="468" y="247.5" text-anchor="middle" font-family="Consolas,ui-monospace,monospace" font-size="13.5" fill="#efc77a">/git-discardall</text>
  <text x="544" y="247.5" font-size="11.5" font-weight="500" fill="#8a8a8a">2nd run</text>
  <text x="406" y="276" font-size="12.5" fill="#a3a3a3">Discards everything. This cannot be undone.</text>

  <path d="M330 256H370" stroke="#6f6f6f" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 5" />
  <path d="M362 256H378" stroke="#6f6f6f" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="354" y="244" text-anchor="middle" font-size="10.5" fill="#7d7d7d">within 1 min</text>
</svg>
