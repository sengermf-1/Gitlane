<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 468" width="560" height="468" font-family="'Segoe UI',-apple-system,Inter,Helvetica,Arial,sans-serif">
  <title>The Gitlane pane</title>
  <rect x=".5" y=".5" width="559" height="467" rx="14" fill="#1a1a1a" stroke="#2b2b2b"/>

  <!-- header -->
  <rect x="24" y="24" width="68" height="30" rx="9" fill="#202020" stroke="#383838"/>
  <text x="38" y="44" font-size="13.5" font-weight="500" fill="#ececec">main</text>
  <path d="M74 37.5l4 4 4-4" fill="none" stroke="#a9a9a9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="44" font-size="13.5" fill="#9a9a9a">New branch</text>

  <text x="352" y="44" font-size="13.5" fill="#9a9a9a">Fetch</text>
  <text x="404" y="44" font-size="13.5" fill="#9a9a9a">Pull</text>
  <rect x="448" y="22" width="88" height="34" rx="11" fill="#f4f4f4"/>
  <text x="492" y="44" text-anchor="middle" font-size="13.5" font-weight="600" fill="#161616">Push <tspan font-weight="500" fill="#555">3</tspan></text>

  <path d="M30 80v9M26.5 83.5l3.5-3.5 3.5 3.5" fill="none" stroke="#d9a441" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="44" y="89" font-size="12.5" fill="#a3a3a3">origin/main · 3 commits to push · last push <tspan font-family="Consolas,ui-monospace,monospace" font-size="12">e025a52</tspan> 1 month ago</text>

  <!-- tabs + legend -->
  <text x="24" y="139" font-size="13.5" font-weight="500" fill="#f2f2f2">History</text>
  <text x="104" y="139" font-size="13.5" fill="#9a9a9a">Changes <tspan fill="#b8b8b8">3</tspan></text>
  <text x="206" y="139" font-size="13.5" fill="#9a9a9a">Branches</text>
  <rect x="352" y="127" width="3" height="14" rx="1.5" fill="#5fb37c"/>
  <text x="362" y="139" font-size="12" fill="#9a9a9a">on remote</text>
  <rect x="436" y="127" width="3" height="14" rx="1.5" fill="#d9a441"/>
  <text x="446" y="139" font-size="12" fill="#9a9a9a">local only</text>

  <!-- filter row -->
  <circle cx="29" cy="173" r="4.6" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M32.5 176.5l3.5 3.5" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="46" y="157" width="238" height="32" rx="10" fill="#222" stroke="#333"/>
  <text x="60" y="177" font-size="12.5" fill="#7d7d7d">Filter by message, author, hash</text>
  <rect x="294" y="157" width="62" height="32" rx="10" fill="#2e2e2e"/>
  <text x="325" y="177" text-anchor="middle" font-size="13" font-weight="500" fill="#e6e6e6">Done</text>

  <!-- rails -->
  <rect x="21" y="226" width="3" height="104" rx="1.5" fill="#d9a441"/>
  <rect x="21" y="330" width="3" height="110" rx="1.5" fill="#5fb37c"/>
  <path d="M36 218V232" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/>
  <path d="M36 232V430" stroke="#2f9bb5" stroke-width="2"/>

  <!-- uncommitted -->
  <circle cx="36" cy="208" r="6" fill="#1a1a1a" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="3 2.4"/>
  <text x="60" y="213" font-size="13" fill="#a3a3a3">3 uncommitted changes</text>

  <!-- commits -->
  <g font-size="13.5" fill="#ececec">
    <circle cx="36" cy="246" r="9" fill="#1a1a1a"/><circle cx="36" cy="246" r="6.5" fill="#2f9bb5"/><circle cx="36" cy="246" r="2.6" fill="#1a1a1a"/>
    <rect x="52" y="233" width="62" height="26" rx="8" fill="#1d3a44" stroke="#2f9bb5"/>
    <circle cx="65" cy="246" r="5.2" fill="none" stroke="#8fd3e6" stroke-width="1.3"/><path d="M62.7 246.2l1.6 1.6 3-3.2" fill="none" stroke="#8fd3e6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="251" font-size="12.5" font-weight="500" fill="#bfeaf5">main</text>
    <text x="124" y="251">Add login form validation</text>

    <circle cx="36" cy="284" r="6.5" fill="#2f9bb5"/>
    <text x="60" y="289">Wire up the auth endpoint</text>

    <circle cx="36" cy="322" r="6.5" fill="#2f9bb5"/>
    <text x="60" y="327">Refactor the session store</text>

    <circle cx="36" cy="360" r="6.5" fill="#2f9bb5"/>
    <text x="60" y="365">Add pull and fetch to the header</text>

    <circle cx="36" cy="398" r="6.5" fill="#2f9bb5"/>
    <text x="60" y="403">Draw the branch graph with lanes</text>

    <circle cx="36" cy="436" r="6.5" fill="#2f9bb5"/>
    <text x="60" y="441">Initial project layout</text>
  </g>

  <g font-family="Consolas,ui-monospace,monospace" font-size="12" fill="#8a8a8a">
    <text x="418" y="251" text-anchor="end">a278546</text>
    <text x="418" y="289" text-anchor="end">1f89ff0</text>
    <text x="418" y="327" text-anchor="end">7bae1a6</text>
    <text x="418" y="365" text-anchor="end">4a1f4c5</text>
    <text x="418" y="403" text-anchor="end">1a52a19</text>
    <text x="418" y="441" text-anchor="end">368e4ab</text>
  </g>
  <g font-size="12.5" fill="#8a8a8a" text-anchor="end">
    <text x="536" y="251">2 days ago</text>
    <text x="536" y="289">3 days ago</text>
    <text x="536" y="327">3 days ago</text>
    <text x="536" y="365">4 days ago</text>
    <text x="536" y="403">4 days ago</text>
    <text x="536" y="441">1 week ago</text>
  </g>
</svg>
